name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tag matches manifest.json version
        run: |
          python3 -c "import json, os; v = json.load(open('custom_components/state_machine/manifest.json'))['version']; tag = os.environ['GITHUB_REF_NAME']; assert v == tag, f'manifest version {v} != tag {tag}'"
      - name: Publish GitHub Release from annotated tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag
